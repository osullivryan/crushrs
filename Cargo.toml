[package]
name = "crushrs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast explicit crash solver for delta-v estimation: crushable-vehicle blocks calibrated to NHTSA tests, one-point hex elements, SIMD kernel"
repository = "https://github.com/osullivryan/crushrs"

[dependencies]
nalgebra = "0.33"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
gif = "0.13"
clap = { version = "4.5", features = ["derive"] }
parquet = { version = "60.0.0", default-features = false, features = ["snap"] }

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 2

[dev-dependencies]
parquet = { version = "60", default-features = false }
